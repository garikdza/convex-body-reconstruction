[project]
name = "convex-body-reconstruction"
version = "0.1.0.dev0"
description = "Convex body reconstruction from noisy support-function measurements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "garikdza" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "cvxpy",
    "clarabel",
]

[project.optional-dependencies]
examples = ["matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
src = [".", "examples"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
# README code blocks keep their hand-aligned comments
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
