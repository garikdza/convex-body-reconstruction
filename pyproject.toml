[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convex-recon"
version = "0.1.0"
description = "Reconstruct convex bodies in 2D and 3D from noisy support-function measurements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Garik" }]
keywords = ["convex geometry", "geometric tomography", "support function", "shape reconstruction", "convex optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.4",
    "clarabel>=0.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.7", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["convex_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
